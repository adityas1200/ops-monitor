# Local smoke-test of the same image used on ECS.
# Usage:
#   docker compose up --build
#   open http://localhost:8001

services:
  ops-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ops-monitor:local
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4.5}
      # Optional Snowflake / DQ defaults (override as needed)
      DQ_TABLE_FQN: ${DQ_TABLE_FQN:-}
      DQ_SUBJECT_AREA: ${DQ_SUBJECT_AREA:-}
      DQ_RULES_TABLE_FQN: ${DQ_RULES_TABLE_FQN:-}
      TASK_MONITOR_DATABASE: ${TASK_MONITOR_DATABASE:-}
      TASK_NAME_PATTERN: ${TASK_NAME_PATTERN:-}
    # Persist settings + agent memory between local restarts
    volumes:
      - ops-monitor-data:/app/backend/app/data
      - ops-monitor-memory:/app/backend/app/memory/store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  ops-monitor-data:
  ops-monitor-memory:
